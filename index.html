<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>토리의 역사 타임머신</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: sticky HUD on top, one mission card in the middle, fixed era-progress strip at the bottom. Palette from dancheong (단청) green-blue, vermilion and ochre. */
:root{
  --bg:#F6EDE1; --surface:#FFFAF4; --surface2:#FBF2E8; --ink:#4A3426; --muted:#8A7262; --line:#E8D7C4;
  --accent:#9C6B43; --accent-ink:#FFFAF4; --accent-text:#8A5A33; --soft:#F8DDE1; --red:#C45F5A; --gold:#D49A45; --good:#6A9450; --bad:#C45F5A; --onpastel:#4A3426;
  --stone:#B8B2A4; --stone2:#968F80; --cel:#8EC1A9; --inlay:#F7F4EA; --metal:#7B8C92; --wood:#956339; --roof:#2C5C58; --flagblue:#2B52A3; --flagred:#CD2E3A; --white:#FFFFFF; --flagline:#1A1A1A;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2A1F19; --surface:#352821; --surface2:#3D2F27; --ink:#F5E9DC; --muted:#C3AE9C; --line:#4E3D32;
  --accent:#D9A77A; --accent-ink:#2A1F19; --accent-text:#E8BE95; --soft:#4A3034; --red:#F2A3A3; --gold:#E8C07A; --good:#A8CF8E; --bad:#F2A3A3;
  --stone:#9C978B; --stone2:#7C776C; --cel:#7FB39B; --inlay:#EDE9DC; --metal:#8C9DA3; --wood:#A8744A; --roof:#4B8C86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2A1F19; --surface:#352821; --surface2:#3D2F27; --ink:#F5E9DC; --muted:#C3AE9C; --line:#4E3D32;
  --accent:#D9A77A; --accent-ink:#2A1F19; --accent-text:#E8BE95; --soft:#4A3034; --red:#F2A3A3; --gold:#E8C07A; --good:#A8CF8E; --bad:#F2A3A3;
  --stone:#9C978B; --stone2:#7C776C; --cel:#7FB39B; --inlay:#EDE9DC; --metal:#8C9DA3; --wood:#A8744A; --roof:#4B8C86; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;line-height:1.25;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* HUD */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
#hud .wrap{display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap;padding-block:8px}
.hud-name{font-family:var(--display);font-size:20px;color:var(--accent-text);margin-right:auto;display:flex;gap:8px;align-items:center}
.hud-name button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:2px 10px;font-family:var(--body);font-size:14px}
.stat{display:flex;flex-direction:column;align-items:flex-start;min-width:64px}
.stat b{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.03em}

/* Bottom era progress */
#prog{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#prog .wrap{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding-block:8px}
.pb{display:flex;flex-direction:column;gap:3px;min-width:0}
.pb small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb .bar{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.pb .bar i{height:8px;border-radius:2px;background:var(--line)}
.pb .bar i.ok{background:var(--accent)}
.pb .bar i.miss{background:var(--stone2)}
main{padding-block:20px 110px}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.btn{border:0;border-radius:12px;padding:12px 22px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:20px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--red);color:var(--white)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}

/* Start */
.start{display:grid;gap:22px;justify-items:center;text-align:center;padding-top:20px}
.start h1{font-size:clamp(34px,7vw,56px);color:var(--accent-text)}
.start h1 em{font-style:normal;color:var(--red)}
.start .lead{max-width:34em;margin:0}
.namebox{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.namebox input{font:inherit;font-size:20px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:min(260px,100%)}
.saved{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.saved button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px}
.tori{width:150px;height:auto}
.err{color:var(--bad);min-height:1.6em;margin:0}

/* Story */
.story{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}
.bubble{background:var(--surface);border:1.5px solid var(--accent);border-radius:18px;padding:20px 22px;font-size:20px;position:relative;min-width:0}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* Hub */
.hubhead{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;margin-bottom:18px}
.hubhead .tori{width:72px}
.dial{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.era{display:grid;gap:6px;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;position:relative}
.era:hover{border-color:var(--accent)}
.era .no{font-family:var(--display);font-size:14px;color:var(--muted)}
.era h3{font-size:22px}
.era .per{font-size:13px;color:var(--muted)}
.era .meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.era .swatch{position:absolute;right:14px;top:14px;width:14px;height:14px;border-radius:50%}
.era.done{background:var(--soft)}
.medal{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:var(--display);font-size:13px;color:var(--onpastel)}
.hubfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center}

/* Mission */
.mhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:12px}
.mhead h2{font-size:24px}
.mtype{display:inline-block;font-size:13px;letter-spacing:.04em;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--accent-text);font-weight:700}
.steps{display:flex;gap:5px}
.steps i{width:24px;height:6px;border-radius:3px;background:var(--line)}
.steps i.ok{background:var(--accent)} .steps i.miss{background:var(--stone2)} .steps i.cur{background:var(--gold)}
.speaker{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:start;margin-bottom:16px}
.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:var(--onpastel)}
.speaker .who{font-family:var(--display);font-size:18px}
.speaker .who small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:6px}
.speaker p{margin:2px 0 0}
.q{font-size:20px;font-weight:700;margin:0 0 14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:14px;text-align:left;font-size:18px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.no{opacity:.4;text-decoration:line-through}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad)}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox .opt{text-align:center;font-family:var(--display);font-size:52px;line-height:1;padding:18px}
.ox .o{color:var(--flagblue)} .ox .x{color:var(--red)}
.statement{background:var(--surface2);border-left:5px solid var(--gold);border-radius:8px;padding:14px 16px;font-size:19px;margin:0 0 14px}
.pics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pic{border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 8px 10px;display:grid;gap:4px;justify-items:center;min-width:0}
.pic svg{width:100%;height:auto;max-width:150px}
.pic span{font-size:15px}
.pic:hover:not(:disabled){border-color:var(--accent)}
.pic.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.pic.no{opacity:.35}
.order{display:grid;gap:8px}
.ev{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;text-align:left;font-size:17px}
.ev .n{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.ev.on{border-color:var(--accent)}
.ev.on .n{border:0;background:var(--accent);color:var(--accent-ink)}
.ev .yr{display:block;font-size:13px;color:var(--muted)}
.tools{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.hintbox{margin-top:14px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px dashed var(--gold)}
.fb{margin-top:16px;border-radius:12px;padding:16px 18px;border:1.5px solid var(--line);background:var(--surface2)}
.fb h3{font-size:22px;margin-bottom:4px}
.fb.good h3{color:var(--good)} .fb.bad h3{color:var(--bad)} .fb.retry h3{color:var(--gold)}
.fb p{margin:6px 0 0}
.fb .exp{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.fb .exp b{color:var(--accent-text)}

/* Era complete & results */
.award{display:grid;gap:16px;justify-items:center;text-align:center}
.bigmedal{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:18px;line-height:1.15;font-family:var(--display);font-size:20px;color:var(--onpastel);box-shadow:inset 0 0 0 6px rgba(255,255,255,.35)}
.minis{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mini{display:grid;justify-items:center;gap:2px;font-size:12px;width:76px}
.mini i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:15px;background:var(--line);color:var(--muted)}
.mini.ok i{background:var(--accent);color:var(--accent-ink)}
.grade{font-family:var(--display);font-size:clamp(34px,6vw,48px);color:var(--red)}
.chart{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:120px 1fr 74px;gap:10px;align-items:center;font-size:15px}
.ctrack{height:18px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.cfill{height:100%;border-radius:4px 0 0 4px}
.crow .v{text-align:right;font-variant-numeric:tabular-nums}
.tl{position:relative;display:grid;gap:18px;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:var(--line);border-radius:2px}
.tle{position:relative}
.tle .dot{position:absolute;left:-26px;top:3px;width:19px;height:19px;border-radius:50%;border:3px solid var(--surface)}
.tle h3{font-size:20px}
.tle ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:2px}
.tle li{display:grid;grid-template-columns:118px 1fr;gap:8px;font-size:15px}
.tle li b{font-variant-numeric:tabular-nums;color:var(--accent-text);font-weight:700}
.tle.locked{opacity:.45}
.section{margin-top:22px}
.section h2{font-size:24px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.kv b{display:block;font-family:var(--display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.kv span{font-size:13px;color:var(--muted)}

@media (max-width:620px){
  body{font-size:16px}
  .opts{grid-template-columns:1fr}
  .pics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .story{grid-template-columns:72px 1fr}
  .bubble{font-size:18px}
  .hud-name{width:100%;font-size:18px}
  #hud .wrap{gap:4px 10px}
  .stat{min-width:0;flex:1} .stat b{font-size:18px} .stat span{font-size:11px}
  .crow{grid-template-columns:84px 1fr 64px;font-size:13px}
  .tle li{grid-template-columns:96px 1fr}
  #prog .wrap{gap:3px}
}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.92)}to{transform:scale(1)}}
}
/* SVG art */
.a-g{fill:var(--line)} .a-st{fill:var(--stone)} .a-st2{fill:var(--stone2)} .a-ln{stroke:var(--stone2);stroke-width:1.5;fill:none}
.a-dk{fill:var(--ink);opacity:.75} .a-cel{fill:var(--cel)} .a-in{fill:var(--inlay)} .a-inl{stroke:var(--inlay);stroke-width:1.6;fill:none}
.a-me{fill:var(--metal)} .a-band{stroke:var(--ink);stroke-width:1.5;opacity:.5;fill:none} .a-wd{fill:var(--wood)} .a-rf{fill:var(--roof)}
.a-red{fill:var(--flagred)} .a-blue{fill:var(--flagblue)} .a-wh{fill:var(--white);stroke:var(--line);stroke-width:1} .a-bk{fill:var(--flagline)}
.a-wave{stroke:var(--flagblue);stroke-width:2;fill:none;opacity:.6} .a-oar{stroke:var(--wood);stroke-width:2}
.t-cap{fill:#8A5A2B} .t-capl{stroke:#6B4420;stroke-width:1.5;fill:none} .t-body{fill:#E3B97A} .t-eye{fill:#1A2B29} .t-gl{fill:#BFE3EC;stroke:#1A2B29;stroke-width:2.5} .t-cheek{fill:#E98A6E;opacity:.6} .t-st{stroke:#1A2B29;stroke-width:2.5;fill:none;stroke-linecap:round} .t-ant{stroke:#6B4420;stroke-width:3} .t-star{fill:#F0B94B}
</style>
</head>
<body>

<header id="hud" hidden></header>
<main id="main" class="wrap"></main>
<footer id="prog" hidden></footer>

<script>
/* ---------- 그림 (직접 그린 문화유산 일러스트) ---------- */

const TYPE = { talk:'인물 대화', ox:'O/X 판단', heritage:'문화유산 찾기', order:'연표 순서' };
const MAX = ERAS.length * 6 * 100;

/* ---------- 저장 ---------- */
const KEY = 'tori-history-v1';
let store = {};
function load(){ try{ store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){ store = {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
let P = null;           // 현재 탐험가
let screen = 'start';
let M = null;           // 진행 중인 미션 상태

/* ---------- 계산 ---------- */
function res(eraId){ return P.res[eraId] || (P.res[eraId] = []); }
function eraDone(e){ return res(e.id).length >= 6; }
function eraScore(e){ return res(e.id).reduce((s,r)=>s+r.score,0); }
function stats(){
  let score=0, badges=0, tried=0, first=0, eras=0;
  ERAS.forEach(e=>{ const r=res(e.id); r.forEach(x=>{score+=x.score; tried++; if(x.ok)badges++; if(x.first)first++;}); if(r.length>=6) eras++; });
  return { score, badges, tried, first, eras, acc: tried ? Math.round(first/tried*100) : 0 };
}
function scoreFor(attempt, hint){ return attempt===1 ? (hint?60:100) : 50; }
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return `${m}:${String(s).padStart(2,'0')}`; }
function gradeOf(pct){
  if(pct>=90) return {name:'역사 박사', note:'모든 시대를 꿰뚫어 본 최고의 시간 여행자!'};
  if(pct>=75) return {name:'시간 여행 대장', note:'우리 역사의 흐름을 잘 이해하고 있어요.'};
  if(pct>=55) return {name:'시간 여행 대원', note:'중요한 사건은 잘 알아요. 해설을 다시 읽으면 더 좋아요.'};
  return {name:'견습 탐험가', note:'연표를 보며 시대 순서를 한 번 더 정리해 봐요.'};
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const $ = s => document.querySelector(s);
const main = $('#main');

/* ---------- HUD & 진행 바 ---------- */
function drawHud(){
  const show = P && screen!=='start';
  $('#hud').hidden = !show; $('#prog').hidden = !show;
  if(!show) return;
  const s = stats();
  $('#hud').innerHTML = `<div class="wrap">
    <div class="hud-name">${esc(P.name)} 탐험가 <button id="toHub" type="button">시대 지도</button></div>
    <div class="stat"><b>${s.badges}<small style="font-size:14px">/48</small></b><span>미션 배지</span></div>
    <div class="stat"><b>${s.eras}<small style="font-size:14px">/8</small></b><span>시대 배지</span></div>
    <div class="stat"><b>${s.score.toLocaleString()}</b><span>점수 / 4,800</span></div>
    <div class="stat"><b>${s.acc}%</b><span>첫 시도 정답률</span></div>
    <div class="stat"><b id="clock">${fmt(P.elapsed)}</b><span>경과 시간</span></div></div>`;
  $('#toHub').onclick = ()=>go('hub');
  $('#prog').innerHTML = `<div class="wrap">${ERAS.map(e=>{
    const r=res(e.id);
    return `<div class="pb" title="${e.name}"><small>${e.short}</small><div class="bar">${[0,1,2,3,4,5].map(i=>`<i class="${r[i]?(r[i].ok?'ok':'miss'):''}"></i>`).join('')}</div></div>`;}).join('')}</div>`;
}
setInterval(()=>{
  if(P && screen!=='start' && screen!=='result' && document.visibilityState==='visible'){
    P.elapsed++; const c=$('#clock'); if(c) c.textContent=fmt(P.elapsed);
    if(P.elapsed%5===0) save();
  }
},1000);

function go(s, arg){ screen=s; window.scrollTo(0,0);
  ({start:renderStart, story:renderStory, hub:renderHub, mission:renderMission, eradone:renderEraDone, result:renderResult})[s](arg);
  drawHud(); }

/* ---------- 시작 ---------- */
function renderStart(){
  const names = Object.keys(store);
  main.innerHTML = `<section class="start">
    ${TORI}
    <h1>토리의 역사 <em>타임머신</em></h1>
    <p class="lead">고조선부터 6·25 전쟁까지, 8개 시대를 여행하며 48개의 미션을 해결하고 고장 난 역사 연표를 고쳐 주세요.</p>
    <form class="namebox" id="nf">
      <label for="nm" class="muted" style="width:100%">탐험가 이름</label>
      <input id="nm" maxlength="12" autocomplete="off" placeholder="예: 5-3 김하늘">
      <button class="btn" type="submit">출발하기</button>
    </form>
    <p class="err" id="er"></p>
    ${names.length?`<div><p class="muted" style="margin:0 0 6px">이 기기에 저장된 탐험가 (눌러서 이어하기)</p><div class="saved">${names.map(n=>{const p=store[n];const sc=ERAS.reduce((s,e)=>s+(p.res[e.id]||[]).reduce((a,r)=>a+r.score,0),0);return `<button type="button" data-n="${esc(n)}">${esc(n)} · ${sc.toLocaleString()}점</button>`;}).join('')}</div></div>`:''}
  </section>`;
  $('#nf').onsubmit = ev=>{ ev.preventDefault(); const n=$('#nm').value.trim();
    if(!n){ $('#er').textContent='이름을 입력해야 출발할 수 있어요.'; return; }
    begin(n); };
  main.querySelectorAll('.saved button').forEach(b=>b.onclick=()=>begin(b.dataset.n));
}
function begin(name){
  if(!store[name]) store[name] = { name, elapsed:0, intro:false, res:{} };
  P = store[name]; save();
  go(P.intro ? 'hub' : 'story', 0);
}

/* ---------- 이야기 ---------- */
function storyLines(){ return [
  `안녕, ${esc(P.name)}! 나는 시간 여행 안내자 <b>토리</b>야. 도토리처럼 작지만, 5,000년 우리 역사를 넘나드는 타임머신을 운전하지.`,
  `그런데 큰일이 났어! 타임머신에 들어 있던 <b>역사 연표</b>가 고장 나서, 기억 조각이 8개 시대로 흩어져 버렸어.`,
  `시대마다 그때 사람들을 만나 <b>미션 6개</b>를 해결하면 미션 배지를 얻고, 6개를 모두 풀면 <b>시대 배지</b>를 받아. 어느 시대부터 가도 괜찮아.`,
  `처음에 맞히면 <b>100점</b>, 힌트를 보고 맞히면 <b>60점</b>, 틀려도 한 번 더 도전해서 맞히면 <b>50점</b>이야. 모든 미션에 해설이 있으니 틀려도 배우는 거야!`,
  `8개 시대를 모두 다녀오면 네가 고친 <b>우리 역사 연표</b>와 성적표를 보여 줄게. 자, 출발해 볼까?`]; }
function renderStory(step){
  const L = storyLines(); step = step||0;
  main.innerHTML = `<section style="display:grid;gap:18px;padding-top:24px">
    <div class="story">${TORI}<div class="bubble pop">${L[step]}</div></div>
    <div class="row" style="justify-content:space-between">
      <div class="dots">${L.map((_,i)=>`<i class="${i===step?'on':''}"></i>`).join('')}</div>
      <div class="row">${step>0?`<button class="btn ghost" id="pv" type="button">이전</button>`:''}
      <button class="btn" id="nx" type="button">${step<L.length-1?'다음':'시대 지도 열기'}</button></div>
    </div></section>`;
  if(step>0) $('#pv').onclick=()=>renderStory(step-1);
  $('#nx').onclick=()=>{ if(step<L.length-1) renderStory(step+1); else { P.intro=true; save(); go('hub'); } };
}

/* ---------- 시대 지도 ---------- */
function renderHub(){
  const s = stats();
  const msg = s.eras===8 ? '연표를 모두 고쳤어! 아래에서 최종 결과를 확인해 봐.' : s.tried===0 ? '가고 싶은 시대를 골라 봐. 어디부터 가도 괜찮아!' : `지금까지 시대 배지 ${s.eras}개! 다음은 어느 시대로 갈까?`;
  main.innerHTML = `<div class="hubhead">${TORI}<div class="bubble">${msg}</div></div>
    <h2 style="font-size:26px;margin-bottom:10px">시대 지도</h2>
    <div class="dial">${ERAS.map((e,i)=>{ const r=res(e.id), d=r.length>=6;
      return `<button type="button" class="era ${d?'done':''}" data-i="${i}">
        <span class="swatch" style="background:${e.color}"></span>
        <span class="no">${i+1}번째 시대</span><h3>${e.name}</h3><span class="per">${e.per}</span>
        <span class="meta"><span>${d?`<span class="medal" style="background:${e.color}">완료</span>`:`미션 ${r.length}/6`}</span><span>${eraScore(e)}점</span></span></button>`; }).join('')}</div>
    <div class="hubfoot"><span class="muted">연표 순서대로 가면 흐름을 익히기 좋아요.</span>
      <button class="btn ${s.eras===8?'':'ghost'}" id="rs" type="button">${s.eras===8?'최종 결과 보기':'중간 탐험 일지 보기'}</button></div>`;
  main.querySelectorAll('.era').forEach(b=>b.onclick=()=>{ const e=ERAS[+b.dataset.i]; if(eraDone(e)) go('eradone', +b.dataset.i); else startMission(+b.dataset.i); });
  $('#rs').onclick=()=>go('result');
}

/* ---------- 미션 ---------- */
function startMission(ei){
  const e = ERAS[ei], idx = res(e.id).length;
  const m = e.missions[idx];
  M = { ei, idx, attempt:1, hint:false, done:false, picked:[], disabled:[], showHint:false, fb:null };
  if(m.t==='talk') M.opts = shuffle(m.opts.map((t,i)=>({t, ok:i===0})));
  if(m.t==='heritage') M.opts = shuffle(m.opts.map((k,i)=>({k, ok:i===0})));
  if(m.t==='order') M.ord = shuffleOrder(m.items);
  go('mission');
}
function shuffleOrder(items){ let s; do{ s=shuffle(items.map((x,i)=>({...x,i}))); }while(s.every((x,k)=>x.i===k)); return s; }

function renderMission(){
  const e = ERAS[M.ei], m = e.missions[M.idx], r = res(e.id);
  const isRetryOX = m.t==='ox' && M.attempt===2;
  const q = isRetryOX ? m.retry.q : m.q;
  const first = M.idx===0 && M.attempt===1 && !M.done;
  let body = '';
  if(m.t==='talk'){
    body = `<div class="opts">${M.opts.map((o,i)=>{
      let c='opt'; if(M.disabled.includes(i)) c+=' no'; if(M.done && o.ok) c+=' right';
      return `<button type="button" class="${c}" data-i="${i}" ${M.done||M.disabled.includes(i)?'disabled':''}>${esc(o.t)}</button>`;}).join('')}</div>`;
  } else if(m.t==='ox'){
    const ans = isRetryOX ? m.retry.a : m.a;
    body = `<p class="statement">${esc(q)}</p><div class="ox">
      <button type="button" class="opt o ${M.done&&ans?'right':''}" data-v="1" ${M.done?'disabled':''} aria-label="맞다">O</button>
      <button type="button" class="opt x ${M.done&&!ans?'right':''}" data-v="0" ${M.done?'disabled':''} aria-label="틀리다">X</button></div>`;
  } else if(m.t==='heritage'){
    body = `<div class="pics">${M.opts.map((o,i)=>{
      let c='pic'; if(M.disabled.includes(i)) c+=' no'; if(M.done && o.ok) c+=' right';
      return `<button type="button" class="${c}" data-i="${i}" ${M.done||M.disabled.includes(i)?'disabled':''}>${ART[o.k].svg}<span>${ART[o.k].name}</span></button>`;}).join('')}</div>`;
  } else {
    body = `<div class="order">${M.ord.map((x,i)=>{ const p=M.picked.indexOf(i);
      const showYr = M.done;
      return `<button type="button" class="ev ${p>=0?'on':''}" data-i="${i}" ${M.done?'disabled':''}><span class="n">${p>=0?p+1:''}</span><span>${esc(x.text)}${showYr?`<span class="yr">${esc(x.year)}</span>`:''}</span></button>`;}).join('')}</div>`;
  }
  const canHint = !M.done && M.attempt===1 && !M.hint;
  const hintText = m.t==='order' ? `가장 먼저 일어난 일은 "${m.items[0].text}"이에요.` : m.hint;
  main.innerHTML = `<section>
    ${first?`<div class="speaker"><div class="avatar" style="background:var(--accent)">토</div><div><div class="who">토리 <small>${e.name} 도착!</small></div><p>${esc(e.arrive)}</p></div></div>`:''}
    <div class="card">
      <div class="mhead"><h2>${e.name} · 미션 ${M.idx+1}</h2><div class="row"><span class="mtype">${TYPE[m.t]}</span>
        <div class="steps">${[0,1,2,3,4,5].map(i=>`<i class="${r[i]?(r[i].ok?'ok':'miss'):(i===M.idx?'cur':'')}"></i>`).join('')}</div></div></div>
      <div class="speaker"><div class="avatar" style="background:${m.who==='토리'?'var(--accent)':e.color}">${esc(m.who[0])}</div>
        <div><div class="who">${esc(m.who)} <small>${esc(m.role)}</small></div><p>${esc(m.line)}</p></div></div>
      ${m.t==='ox'?`<p class="q">${isRetryOX?'새 문장으로 재도전! 맞으면 O, 틀리면 X를 고르세요.':'이 말이 맞으면 O, 틀리면 X를 고르세요.'}</p>`:`<p class="q">${esc(m.q)}</p>`}
      ${body}
      ${M.showHint?`<div class="hintbox"><b>힌트</b> ${esc(hintText)}</div>`:''}
      ${M.fb||''}
      <div class="tools">
        <div class="row">${canHint?`<button type="button" class="btn ghost" id="hb">힌트 보기 (최대 60점)</button>`:''}
        ${m.t==='order'&&!M.done?`<button type="button" class="btn ghost" id="rb">다시 고르기</button>`:''}</div>
        <div class="row">${m.t==='order'&&!M.done?`<button type="button" class="btn" id="cb" ${M.picked.length<4?'disabled':''}>순서 확인</button>`:''}
        ${M.done?`<button type="button" class="btn" id="nb">${M.idx<5?'다음 미션':'시대 배지 받기'}</button>`:''}</div>
      </div>
    </div></section>`;
  // events
  if(canHint) $('#hb').onclick=()=>{ M.hint=true; M.showHint=true; renderMission(); };
  if(m.t==='talk'||m.t==='heritage') main.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; judge(M.opts[i].ok, ()=>M.disabled.push(i)); });
  if(m.t==='ox') main.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ const v=b.dataset.v==='1'; judge(v===(isRetryOX?m.retry.a:m.a)); });
  if(m.t==='order' && !M.done){
    main.querySelectorAll('.ev').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i, p=M.picked.indexOf(i);
      if(p>=0) M.picked = M.picked.slice(0,p); else M.picked.push(i); renderMission(); });
    $('#rb').onclick=()=>{ M.picked=[]; renderMission(); };
    $('#cb').onclick=()=>{ const ok = M.picked.every((x,k)=>M.ord[x].i===k);
      judge(ok, ()=>{ M.picked=[]; M.ord=shuffleOrder(m.items); }); };
  }
  if(M.done) $('#nb').onclick=()=>{ if(M.idx<5) startMission(M.ei); else go('eradone', M.ei); };
}

function judge(ok, onWrongFirst){
  const e = ERAS[M.ei], m = e.missions[M.idx];
  if(ok){
    const sc = scoreFor(M.attempt, M.hint);
    finish(sc, true, M.attempt===1);
    const why = M.attempt===1 ? (M.hint?'힌트를 보고 맞혔어요':'한 번에 맞혔어요') : '재도전 성공';
    M.fb = `<div class="fb good pop"><h3>정답! +${sc}점</h3><p>${why}. 미션 배지를 얻었어요.</p><div class="exp">${expOf(m)}</div></div>`;
  } else if(M.attempt===1){
    M.attempt = 2; M.showHint=false;
    if(onWrongFirst) onWrongFirst();
    if(m.t==='ox'){
      M.fb = `<div class="fb retry pop"><h3>아쉬워요! 먼저 해설을 읽어 보세요</h3><div class="exp">${m.exp}</div><p>이제 <b>새로운 문장</b>으로 재도전해요. 맞히면 50점!</p></div>`;
    } else {
      M.fb = `<div class="fb retry pop"><h3>아쉬워요! 한 번 더 도전해 보세요</h3><p>${m.t==='order'?'순서가 맞지 않아요. 사건들을 다시 순서대로 눌러 보세요.':'고른 답을 지웠어요. 남은 것 중에서 다시 골라 보세요.'} 맞히면 50점!</p></div>`;
    }
  } else {
    finish(0, false, false);
    M.fb = `<div class="fb bad pop"><h3>이번에는 틀렸어요 (0점)</h3><p>정답을 표시해 두었어요. 해설을 읽고 기억해 봐요.</p><div class="exp">${expOf(m)}</div></div>`;
  }
  renderMission(); drawHud();
}
function expOf(m){ return (m.t==='ox' && M.attempt===2) ? m.retry.exp : m.exp; }
function finish(score, ok, first){
  M.done = true;
  if(ERAS[M.ei].missions[M.idx].t==='order'){ M.picked = M.ord.map((x,k)=>k).sort((a,b)=>M.ord[a].i-M.ord[b].i); }
  res(ERAS[M.ei].id)[M.idx] = { score, ok, first, hint:M.hint };
  save();
}

/* ---------- 시대 배지 ---------- */
function renderEraDone(ei){
  const e = ERAS[ei], r = res(e.id), sc = eraScore(e), s = stats();
  const next = ERAS.findIndex(x=>!eraDone(x));
  main.innerHTML = `<section class="card award pop">
    <div class="bigmedal" style="background:${e.color}">${e.short}</div>
    <h2 style="font-size:30px">${e.name} 시대 배지 획득!</h2>
    <p style="margin:0">이 시대에서 <b>${sc}점</b> / 600점, 미션 배지 <b>${r.filter(x=>x.ok).length}개</b>를 모았어요.</p>
    <div class="minis">${e.missions.map((m,i)=>`<div class="mini ${r[i]&&r[i].ok?'ok':''}"><i>${r[i]?r[i].score:'-'}</i><span>${TYPE[m.t]}</span></div>`).join('')}</div>
    <div style="text-align:left;width:100%"><p style="margin:0 0 6px"><b>되찾은 연표 조각</b></p>
      <ul style="margin:0;padding-left:20px">${e.missions[5].items.map(x=>`<li>${esc(x.year)} · ${esc(x.text)}</li>`).join('')}</ul></div>
    <div class="row" style="justify-content:center">
      ${s.eras===8?`<button class="btn" id="fr" type="button">최종 결과 보기</button>`:`<button class="btn" id="hb2" type="button">다른 시대로 이동</button>`}
    </div></section>`;
  if(s.eras===8) $('#fr').onclick=()=>go('result'); else $('#hb2').onclick=()=>go('hub');
}

/* ---------- 결과 ---------- */
function renderResult(){
  const s = stats(), pct = Math.round(s.score/MAX*100), g = gradeOf(pct), all = s.eras===8;
  main.innerHTML = `<section class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><p class="muted" style="margin:0">${esc(P.name)} 탐험가의 ${all?'최종 결과':'중간 탐험 일지'}</p>
        <div class="grade">${all?g.name:`시대 배지 ${s.eras}/8`}</div>
        <p style="margin:0">${all?g.note:'모든 시대를 다녀오면 등급이 정해져요.'}</p></div>
      <div style="width:90px;flex:none">${TORI.replace('class="tori"','class="tori" style="width:90px"')}</div></div>
    <div class="kv section">
      <div><b>${s.score.toLocaleString()}</b><span>점수 / 4,800 (${pct}%)</span></div>
      <div><b>${s.badges}/48</b><span>미션 배지</span></div>
      <div><b>${s.acc}%</b><span>첫 시도 정답률 (${s.first}/${s.tried})</span></div>
      <div><b>${fmt(P.elapsed)}</b><span>탐험 시간</span></div></div>
    <div class="section"><h2>시대별 성취</h2><div class="chart">
      ${ERAS.map(e=>{ const v=eraScore(e); return `<div class="crow"><span>${e.short}</span><div class="ctrack"><div class="cfill" style="width:${v/6}%;background:${e.color}"></div></div><span class="v">${v}/600</span></div>`; }).join('')}
    </div><p class="muted" style="font-size:14px;margin:8px 0 0">등급 기준: 90% 이상 역사 박사 · 75% 이상 시간 여행 대장 · 55% 이상 시간 여행 대원 · 그 아래 견습 탐험가</p></div>
    <div class="section"><h2>내가 고친 우리 역사 연표</h2><div class="tl">
      ${ERAS.map(e=>{ const d=eraDone(e); return `<div class="tle ${d?'':'locked'}"><span class="dot" style="background:${e.color}"></span>
        <h3>${e.name} <small class="muted" style="font-family:var(--body);font-size:14px">${d?'시대 배지 획득':'아직 고치지 못한 조각'}</small></h3>
        <ul>${e.missions[5].items.map(x=>`<li><b>${esc(x.year)}</b><span>${d?esc(x.text):'? ? ?'}</span></li>`).join('')}</ul></div>`; }).join('')}
    </div></div>
    <div class="tools"><div class="row"><button class="btn ghost" id="rst" type="button">처음부터 다시 하기</button><span id="cf"></span></div>
      <button class="btn" id="bk" type="button">시대 지도로</button></div>
  </section>`;
  $('#bk').onclick=()=>go('hub');
  $('#rst').onclick=()=>{ $('#cf').innerHTML = `<span class="row"><span>${esc(P.name)}의 기록이 모두 지워져요.</span><button class="btn warn" id="yes" type="button">지우고 다시 시작</button></span>`;
    $('#yes').onclick=()=>{ delete store[P.name]; save(); P=null; go('start'); }; };
}

load(); go('start');
</script>
</body>
</html>
